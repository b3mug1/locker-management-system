services:
  # 1. Backend API (FastAPI)
  - type: web
    name: locker-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: locker-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: FIRST_ADMIN_EMAIL
        value: admin@locker.com
      - key: FIRST_ADMIN_PASSWORD
        value: admin123
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # 2. Frontend SPA (React + Vite)
  - type: web
    name: locker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: locker-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. PostgreSQL Database
  - name: locker-postgres
    region: frankfurt
    plan: free
    databaseName: locker_db
    user: locker_admin
