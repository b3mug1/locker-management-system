openapi: 3.0.3
info:
  title: Locker Management System API
  description: |
    REST API for the Locker Management System.

    The backend is implemented with FastAPI and exposes endpoints for authentication,
    user management, student management, locker inventory, locker assignments,
    dashboard statistics, analytics, CSV imports, and health checks.

    Most endpoints require a JWT Bearer token. Admin-only endpoints additionally
    require the authenticated user to have the `admin` role.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local FastAPI server
  - url: http://localhost:3000
    description: Docker frontend/Nginx proxy

tags:
  - name: Authentication
    description: Login and password management
  - name: Users
    description: User account management. Admin only.
  - name: Students
    description: Student record management. Admin only.
  - name: Lockers
    description: Locker inventory management. Admin only.
  - name: Assignments
    description: Locker assignment lifecycle and user locker views
  - name: Dashboard
    description: Admin dashboard statistics and analytics
  - name: Health
    description: Service health checks

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
          example: Not found

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - role
        - user_id
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          example: bearer
          default: bearer
        role:
          type: string
          enum:
            - admin
            - user
          example: admin
        user_id:
          type: integer
          example: 1

    PasswordChange:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          example: oldPass123
        new_password:
          type: string
          minLength: 6
          example: newPass456

    UserCreate:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: student@example.com
        password:
          type: string
          format: password
          example: user123
        role:
          type: string
          enum:
            - admin
            - user
          default: user
        student_id:
          type: integer
          nullable: true
          example: 10

    UserRead:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: student@example.com
        role:
          type: string
          enum:
            - admin
            - user
          example: user
        student_id:
          type: integer
          nullable: true
          example: 10
        student_name:
          type: string
          nullable: true
          example: Jane Smith
        student_barcode:
          type: string
          nullable: true
          example: STU-000010

    UserCreateResponse:
      allOf:
        - $ref: '#/components/schemas/UserRead'
        - type: object
          properties:
            email_sent:
              type: boolean
              description: Whether SMTP credential delivery succeeded.
              example: false

    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
          example: new.email@example.com
        role:
          type: string
          enum:
            - admin
            - user
        student_id:
          type: integer
          nullable: true

    InclusiveStatus:
      type: string
      enum:
        - none
        - disability
        - orphan
        - vision
        - hearing
        - other

    StudentCreate:
      type: object
      required:
        - full_name
        - group
        - barcode
        - course
      properties:
        full_name:
          type: string
          example: Jane Smith
        group:
          type: string
          example: CS-2201
        barcode:
          type: string
          example: STU-000123
        course:
          type: integer
          example: 2
        inclusive_status:
          $ref: '#/components/schemas/InclusiveStatus'
          default: none

    StudentRead:
      type: object
      required:
        - id
        - full_name
        - group
        - barcode
        - course
        - inclusive_status
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: Jane Smith
        group:
          type: string
          example: CS-2201
        barcode:
          type: string
          example: STU-000123
        course:
          type: integer
          example: 2
        inclusive_status:
          $ref: '#/components/schemas/InclusiveStatus'

    StudentUpdate:
      type: object
      properties:
        full_name:
          type: string
        group:
          type: string
        barcode:
          type: string
        course:
          type: integer
        inclusive_status:
          $ref: '#/components/schemas/InclusiveStatus'

    LockerSize:
      type: string
      enum:
        - small
        - medium
        - large

    LockerAccessType:
      type: string
      enum:
        - pin
        - key

    LockerStatus:
      type: string
      enum:
        - active
        - inactive
        - maintenance

    LockerCreate:
      type: object
      required:
        - number
      description: |
        Locker configuration rules enforced by the backend:
        - large + pin = capacity 1
        - medium + pin = capacity 2
        - medium + key = capacity 2
        - small + key = capacity 1
      properties:
        number:
          type: string
          example: L-001
        size:
          $ref: '#/components/schemas/LockerSize'
          default: medium
        access_type:
          $ref: '#/components/schemas/LockerAccessType'
          default: key
        capacity:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
          example: 2
        floor:
          type: integer
          default: 1
          example: 3
        status:
          $ref: '#/components/schemas/LockerStatus'
          default: active

    LockerRead:
      type: object
      required:
        - id
        - number
        - size
        - access_type
        - capacity
        - floor
        - status
        - occupied_count
      properties:
        id:
          type: integer
          example: 1
        number:
          type: string
          example: L-001
        size:
          $ref: '#/components/schemas/LockerSize'
        access_type:
          $ref: '#/components/schemas/LockerAccessType'
        capacity:
          type: integer
          example: 2
        floor:
          type: integer
          example: 3
        status:
          $ref: '#/components/schemas/LockerStatus'
        occupied_count:
          type: integer
          example: 1

    LockerUpdate:
      type: object
      properties:
        number:
          type: string
        size:
          $ref: '#/components/schemas/LockerSize'
        access_type:
          $ref: '#/components/schemas/LockerAccessType'
        capacity:
          type: integer
          minimum: 1
          maximum: 2
        floor:
          type: integer
        status:
          $ref: '#/components/schemas/LockerStatus'

    AssignmentCreate:
      type: object
      required:
        - student_id
        - locker_id
      properties:
        student_id:
          type: integer
          example: 3
        locker_id:
          type: integer
          example: 7
        force:
          type: boolean
          default: false
          description: Override priority-student warning when assigning a non-priority student.

    AssignmentRead:
      type: object
      required:
        - id
        - student_id
        - locker_id
        - assigned_at
      properties:
        id:
          type: integer
          example: 1
        student_id:
          type: integer
          example: 3
        locker_id:
          type: integer
          example: 7
        assigned_at:
          type: string
          format: date-time
          example: '2026-04-06T10:30:00Z'
        released_at:
          type: string
          format: date-time
          nullable: true
          example: null
        student_name:
          type: string
          nullable: true
          example: Jane Smith
        locker_number:
          type: string
          nullable: true
          example: L-001

    CountResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          example: 100

    CSVImportResponse:
      type: object
      properties:
        created:
          type: integer
          example: 10
        skipped:
          type: integer
          example: 2
        errors:
          type: array
          items:
            type: string
          example:
            - 'Row 5: missing required field'

    CombinedCSVImportResponse:
      type: object
      properties:
        created_students:
          type: integer
          example: 5
        created_lockers:
          type: integer
          example: 5
        created_assignments:
          type: integer
          example: 5
        skipped:
          type: integer
          example: 1
        errors:
          type: array
          items:
            type: string

    UserDashboardStudent:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        full_name:
          type: string
        group:
          type: string
        barcode:
          type: string
        course:
          type: integer

    UserDashboardActiveLocker:
      type: object
      nullable: true
      properties:
        number:
          type: string
          example: L-001
        floor:
          type: integer
        size:
          type: string
        access_type:
          type: string
        capacity:
          type: integer
        occupied:
          type: integer
        assigned_at:
          type: string
          format: date-time
          nullable: true

    UserDashboardAssignment:
      type: object
      properties:
        id:
          type: integer
        locker_number:
          type: string
          nullable: true
        locker_floor:
          type: integer
          nullable: true
        locker_size:
          type: string
          nullable: true
        locker_access_type:
          type: string
          nullable: true
        assigned_at:
          type: string
          format: date-time
          nullable: true
        released_at:
          type: string
          format: date-time
          nullable: true

    UserDashboardResponse:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
        student:
          $ref: '#/components/schemas/UserDashboardStudent'
        active_locker:
          $ref: '#/components/schemas/UserDashboardActiveLocker'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/UserDashboardAssignment'
        total_assignments:
          type: integer
        active_count:
          type: integer

    FloorStat:
      type: object
      properties:
        floor:
          type: integer
          example: 1
        lockers:
          type: integer
          example: 25
        capacity:
          type: integer
          example: 40
        occupied:
          type: integer
          example: 16
        available:
          type: integer
          example: 24

    RecentAssignment:
      type: object
      properties:
        id:
          type: integer
        student_name:
          type: string
          nullable: true
        locker_number:
          type: string
          nullable: true
        assigned_at:
          type: string
          format: date-time
          nullable: true
        released_at:
          type: string
          format: date-time
          nullable: true

    StudentsByCourse:
      type: object
      properties:
        course:
          type: integer
          example: 2
        count:
          type: integer
          example: 30

    DashboardStatsResponse:
      type: object
      properties:
        students_count:
          type: integer
        lockers_count:
          type: integer
        active_lockers:
          type: integer
        users_count:
          type: integer
        active_assignments:
          type: integer
        total_assignments:
          type: integer
        total_capacity:
          type: integer
        available_spots:
          type: integer
        occupancy_rate:
          type: number
          format: float
        occupied_lockers:
          type: integer
        floor_stats:
          type: array
          items:
            $ref: '#/components/schemas/FloorStat'
        recent_assignments:
          type: array
          items:
            $ref: '#/components/schemas/RecentAssignment'
        students_by_course:
          type: array
          items:
            $ref: '#/components/schemas/StudentsByCourse'
        maintenance_count:
          type: integer

    OccupancyTrendPoint:
      type: object
      properties:
        date:
          type: string
          example: '2026-05-01'
        occupied:
          type: integer
        capacity:
          type: integer
        rate:
          type: number
          format: float

    DailyCount:
      type: object
      properties:
        date:
          type: string
          example: '2026-05-01'
        count:
          type: integer

    SizeStat:
      type: object
      properties:
        size:
          type: string
          example: medium
        lockers:
          type: integer
        capacity:
          type: integer
        occupied:
          type: integer

    DashboardAnalyticsResponse:
      type: object
      properties:
        period:
          type: string
          enum:
            - week
            - month
            - quarter
        total_capacity:
          type: integer
        occupancy_trend:
          type: array
          items:
            $ref: '#/components/schemas/OccupancyTrendPoint'
        assignments_per_day:
          type: array
          items:
            $ref: '#/components/schemas/DailyCount'
        releases_per_day:
          type: array
          items:
            $ref: '#/components/schemas/DailyCount'
        size_stats:
          type: array
          items:
            $ref: '#/components/schemas/SizeStat'
        peak_days:
          type: array
          items:
            $ref: '#/components/schemas/DailyCount'
        maintenance_count:
          type: integer

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: locker-management-system

  parameters:
    SkipParam:
      name: skip
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit100Param:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Limit200Param:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200

  responses:
    Unauthorized:
      description: Missing, expired, or invalid JWT token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated user does not have enough permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      security: []
      responses:
        '200':
          description: Backend service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login and receive a JWT token
      description: Uses OAuth2 password form fields. The `username` field should contain the user's email address.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  format: email
                  example: admin@locker.com
                password:
                  type: string
                  format: password
                  example: admin123
      responses:
        '200':
          description: Successful login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Incorrect email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: Password changed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password changed successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/:
    get:
      tags:
        - Users
      summary: List all users
      description: Admin only.
      responses:
        '200':
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Users
      summary: Create a user account
      description: Admin only. The backend attempts to email credentials after user creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '400':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Admin only.
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Users
      summary: Update user
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Users
      summary: Delete user
      description: Admin only.
      responses:
        '204':
          description: User deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/students/:
    get:
      tags:
        - Students
      summary: List students
      description: Admin only. Priority/inclusive students are sorted first by the backend.
      parameters:
        - $ref: '#/components/parameters/SkipParam'
        - $ref: '#/components/parameters/Limit100Param'
      responses:
        '200':
          description: List of students.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Students
      summary: Create student
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Student created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/students/count:
    get:
      tags:
        - Students
      summary: Count students
      description: Admin only.
      responses:
        '200':
          description: Student count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/students/import-csv:
    post:
      tags:
        - Students
      summary: Import students from CSV
      description: |
        Admin only. Expected columns include `full_name`, `barcode`, `group`, and optionally `course`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: CSV import result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSVImportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/students/{student_id}:
    parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    get:
      tags:
        - Students
      summary: Get student by ID
      description: Admin only.
      responses:
        '200':
          description: Student found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Students
      summary: Update student
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdate'
      responses:
        '200':
          description: Student updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Students
      summary: Delete student
      description: Admin only.
      responses:
        '204':
          description: Student deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/lockers/:
    get:
      tags:
        - Lockers
      summary: List lockers
      description: Admin only. Each locker includes `occupied_count`.
      parameters:
        - $ref: '#/components/parameters/SkipParam'
        - $ref: '#/components/parameters/Limit100Param'
      responses:
        '200':
          description: List of lockers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LockerRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Lockers
      summary: Create locker
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockerCreate'
            examples:
              small_key:
                summary: Small key locker
                value:
                  number: L-101
                  size: small
                  access_type: key
                  capacity: 1
                  floor: 1
                  status: active
              medium_pin:
                summary: Medium PIN locker
                value:
                  number: L-102
                  size: medium
                  access_type: pin
                  capacity: 2
                  floor: 2
                  status: active
              large_pin:
                summary: Large PIN locker
                value:
                  number: L-103
                  size: large
                  access_type: pin
                  capacity: 1
                  floor: 3
                  status: active
      responses:
        '201':
          description: Locker created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerRead'
        '400':
          description: Locker number already exists or invalid locker configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/lockers/count:
    get:
      tags:
        - Lockers
      summary: Count lockers
      description: Admin only.
      responses:
        '200':
          description: Locker count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/lockers/import-csv:
    post:
      tags:
        - Lockers
      summary: Import lockers from CSV
      description: |
        Admin only. Expected columns include `number`, and optionally `size`, `access_type`, `capacity`, `floor`, and `status`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: CSV import result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSVImportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/lockers/{locker_id}:
    parameters:
      - name: locker_id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    get:
      tags:
        - Lockers
      summary: Get locker by ID
      description: Admin only.
      responses:
        '200':
          description: Locker found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Lockers
      summary: Update locker
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockerUpdate'
      responses:
        '200':
          description: Locker updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockerRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Lockers
      summary: Delete locker
      description: Admin only.
      responses:
        '204':
          description: Locker deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assignments/:
    get:
      tags:
        - Assignments
      summary: List all assignments
      description: Admin only.
      parameters:
        - $ref: '#/components/parameters/SkipParam'
        - $ref: '#/components/parameters/Limit200Param'
      responses:
        '200':
          description: List of assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Assignments
      summary: Assign locker to student
      description: |
        Admin only.

        Business rules:
        - Student must exist.
        - Locker must exist and be active.
        - Student cannot already have an active assignment.
        - Locker capacity cannot be exceeded.
        - If priority students are waiting, assigning a non-priority student returns `409` unless `force` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentRead'
        '400':
          description: Business rule violation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Priority students are waiting. Retry with `force: true` to override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: priority_students_waiting:3

  /api/v1/assignments/my:
    get:
      tags:
        - Assignments
      summary: Get current user's assignments
      description: Returns assignments for the student linked to the authenticated user account.
      responses:
        '200':
          description: Current user's assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssignmentRead'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assignments/my-dashboard:
    get:
      tags:
        - Assignments
      summary: Get current user's locker dashboard
      description: Returns profile data, active locker, assignment history, and counts for the authenticated user.
      responses:
        '200':
          description: User dashboard data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assignments/active-count:
    get:
      tags:
        - Assignments
      summary: Count active assignments
      description: Admin only.
      responses:
        '200':
          description: Active assignment count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/assignments/release-all:
    post:
      tags:
        - Assignments
      summary: Release all active assignments
      description: Admin only. Sets `released_at` for every active assignment.
      responses:
        '200':
          description: Number of assignments released.
          content:
            application/json:
              schema:
                type: object
                properties:
                  released:
                    type: integer
                    example: 42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/assignments/import-combined-csv:
    post:
      tags:
        - Assignments
      summary: Import students, lockers, and assignments from one CSV
      description: |
        Admin only. Expected columns can include English or Russian labels:
        `full_name`/`ФИО`, `barcode`/`Штрихкод`, `group`/`Группа`, `course`/`Курс`,
        `locker_number`/`Номер локера`, `size`/`Тип локера`, `floor`/`Этаж`, `access_type`/`Доступ`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Combined CSV import result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedCSVImportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/assignments/{assignment_id}/release:
    post:
      tags:
        - Assignments
      summary: Release assignment
      description: Admin only. Sets `released_at` for a single active assignment.
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Assignment released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentRead'
        '400':
          description: Assignment already released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: Get dashboard statistics
      description: Admin only.
      responses:
        '200':
          description: Dashboard statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/dashboard/analytics:
    get:
      tags:
        - Dashboard
      summary: Get dashboard analytics
      description: Admin only. Returns occupancy trends and assignment analytics over the selected period.
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum:
              - week
              - month
              - quarter
            default: month
      responses:
        '200':
          description: Dashboard analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAnalyticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

x-websocket:
  url: ws://localhost:8000/ws
  description: |
    FastAPI WebSocket endpoint used by the frontend for realtime updates.
    The server broadcasts JSON messages with an `event` field, for example:
    `{ "event": "student_change", "data": null }`.
  events:
    - student_change
    - locker_change
    - assignment_change
